name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run build without publishing a GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Extract and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})."
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${PKG_VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release version: ${VERSION}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build application and Windows packages
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --win nsis portable --x64 --publish never \
            -c.nsis.artifactName='LLMSkillz-${version}-setup-${arch}.${ext}' \
            -c.portable.artifactName='LLMSkillz-${version}-portable-${arch}.${ext}'

      - name: Stage release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "release/LLMSkillz-${VERSION}-setup-x64.exe" "staging/"
          cp "release/LLMSkillz-${VERSION}-portable-x64.exe" "staging/"
          ls -lh staging/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish Draft Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
