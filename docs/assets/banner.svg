<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="LLMSkillz banner">
  <defs>
    <radialGradient id="ambientGlow" cx="0%" cy="50%" r="48%" fx="0%" fy="50%">
      <stop offset="0%" stop-color="#3B7BFF" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#1D63FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#111216" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18" />
    </clipPath>
  </defs>

  <!-- Base card -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="#111216" stroke="#262830" stroke-width="1" />

  <g clip-path="url(#cardClip)">
    <!-- Ambient left glow -->
    <rect x="0" y="0" width="680" height="320" fill="url(#ambientGlow)" />

    <!-- Right geometric diagonal lines -->
    <line x1="930" y1="-20" x2="1120" y2="340" stroke="#3B7BFF" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="990" y1="-20" x2="1180" y2="340" stroke="#3B7BFF" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="1050" y1="-20" x2="1240" y2="340" stroke="#3B7BFF" stroke-opacity="0.22" stroke-width="1.5" />

    <!-- Left accent bar -->
    <rect x="4" y="40" width="8" height="240" rx="4" fill="#3B7BFF" />

    <!-- Title & Subtitle -->
    <text x="56" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#3B7BFF" letter-spacing="-0.8">LLMSkillz</text>
    <text x="56" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#D4D4D8">Desktop manager for authoring and syncing LLM skills across Antigravity, Claude, and Codex</text>

    <!-- Feature pills -->
    <g transform="translate(56, 226)">
      <rect x="0" y="0" width="216" height="42" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#3B7BFF" />
      <text x="36" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Markdown Split Editor</text>
    </g>

    <g transform="translate(286, 226)">
      <rect x="0" y="0" width="202" height="42" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#3B7BFF" />
      <text x="36" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">SHA-256 Sync Status</text>
    </g>

    <g transform="translate(502, 226)">
      <rect x="0" y="0" width="204" height="42" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#3B7BFF" />
      <text x="36" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Multi-Target Install</text>
    </g>

    <g transform="translate(720, 226)">
      <rect x="0" y="0" width="196" height="42" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
      <circle cx="20" cy="21" r="5" fill="#3B7BFF" />
      <text x="36" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">Local-First Library</text>
    </g>
  </g>
</svg>
